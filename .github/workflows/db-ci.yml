name: Database CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "root" ]
  pull_request:
    branches: [ "master", "main", "root" ]

jobs:
  database-ci:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup sqlpackage
        run: |
          wget -qO- https://aka.ms/sqlpackage-linux -O sqlpackage.zip
          unzip -o -q sqlpackage.zip -d sqlpackage/
          chmod +x sqlpackage/sqlpackage

      - name: Deploy DACPAC to Test Database
        run: |
          ./sqlpackage/sqlpackage \
            /Action:Publish \
            /SourceFile:database/dacpac/DatabaseCicdLab.dacpac \
            /TargetConnectionString:'Server=localhost,1433;Database=CI_Test_DB;User Id=sa;Password=${{ secrets.SA_PASSWORD }};TrustServerCertificate=True;'

      - name: Install and Run tSQLt Tests
        run: |
          # تحميل tSQLt باستخدام curl مع تفعيل الـ redirect لضمان النجاح
          curl -L -s https://github.com/tSQLt/tSQLt/releases/download/v1.0.8695.27484/tSQLt.zip -O
          unzip -o -q tSQLt.zip
          
          # تفعيل صلاحيات الـ CLR على قاعدة البيانات
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "${{ secrets.SA_PASSWORD }}" \
            -Q "USE CI_Test_DB; EXEC sp_configure 'clr enabled', 1; RECONFIGURE;" \
            -C -b

          # تثبيت إطار عمل tSQLt
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "${{ secrets.SA_PASSWORD }}" \
            -i tSQLt/tSQLt.class.sql \
            -C -b

          # إنشاء اختبار وحدة تجريبي للتحقق من وجود جدول Users
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "${{ secrets.SA_PASSWORD }}" \
            -Q "USE CI_Test_DB; 
                EXEC tSQLt.NewTestClass 'UserModuleTests';
                GO
                CREATE PROCEDURE UserModuleTests.test_UsersTableExists
                AS
                BEGIN
                  IF NOT EXISTS (SELECT * FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'Users')
                    EXEC tSQLt.Fail 'Users table does not exist!';
                END;
                GO" \
            -C -b

          # تشغيل جميع الاختبارات
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "${{ secrets.SA_PASSWORD }}" \
            -Q "USE CI_Test_DB; EXEC tSQLt.RunAll;" \
            -C -b